name: Deploy do Meu Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Verificar arquivo do site
        run: test -f index.html
      - name: Mostrar informações do Runner
        run: lsb_release -a
      - name: Mostrar memória RAM
        run: free -h
      - name: Mostrar quantidade de CPUs
        run: nproc
      - name: Criar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  publicar-site:
    needs: validacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
